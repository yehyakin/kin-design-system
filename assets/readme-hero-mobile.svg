<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="title desc">
  <title id="title">KIN certificate-change investigation illustration on a narrow screen</title>
  <desc id="desc">The investigation title, current finding, evidence timeline, selected source, and next action appear in priority order.</desc>

  <rect width="680" height="560" rx="14" fill="#08090a"/>
  <rect x="0.5" y="0.5" width="679" height="559" rx="13.5" fill="none" stroke="#2a2c30"/>
  <rect x="1" y="1" width="678" height="52" rx="13" fill="#0d0e10"/>
  <path d="M1 40h678v13H1z" fill="#0d0e10"/>
  <line x1="1" y1="53" x2="679" y2="53" stroke="#24262a"/>
  <text x="24" y="33" fill="#f4f5f7" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" letter-spacing="0.08em">KIN REFERENCE</text>
  <text x="650" y="33" fill="#777b84" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" text-anchor="end">INT-02</text>

  <g transform="translate(28 83)" font-family="Inter,Arial,sans-serif">
    <text x="0" y="0" fill="#777b84" font-size="14" font-weight="600" letter-spacing="0.07em">INVESTIGATION / INV-028</text>
    <text x="0" y="47" fill="#f4f5f7" font-size="36" font-weight="620" letter-spacing="-0.7">Certificate change review</text>
    <text x="0" y="78" fill="#a4a8b1" font-size="19">Compare chronology and sources before recording a finding.</text>

    <rect x="0" y="104" width="624" height="62" rx="8" fill="#131417" stroke="#292b30"/>
    <text x="18" y="130" fill="#777b84" font-size="13">4 ATTRIBUTABLE SOURCES</text>
    <circle cx="468" cy="135" r="5" fill="#d6a84a"/>
    <text x="482" y="141" fill="#d9b459" font-size="17" font-weight="550">Finding not recorded</text>

    <text x="0" y="204" fill="#f4f5f7" font-size="20" font-weight="600">Evidence timeline</text>
    <text x="624" y="204" fill="#777b84" font-size="14" text-anchor="end">Last 30 days</text>
    <line x1="0" y1="221" x2="624" y2="221" stroke="#2a2c30"/>

    <g transform="translate(0 238)">
      <text x="0" y="19" fill="#8b8f98" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">09:11</text>
      <text x="74" y="18" fill="#e7e8eb" font-size="18" font-weight="560">Change-log source unavailable</text>
      <circle cx="538" cy="15" r="4" fill="#d6a84a"/>
      <text x="551" y="20" fill="#c8a558" font-size="14">Pending</text>
      <line x1="0" y1="48" x2="624" y2="48" stroke="#24262a"/>
    </g>

    <g transform="translate(0 298)">
      <rect x="-10" y="-7" width="644" height="48" rx="6" fill="#17191d"/>
      <text x="0" y="19" fill="#aeb1b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">09:02</text>
      <text x="74" y="18" fill="#ffffff" font-size="18" font-weight="580">Certificate issuer changed</text>
      <circle cx="538" cy="15" r="4" fill="#d85b68"/>
      <text x="551" y="20" fill="#df7883" font-size="14">Conflict</text>
    </g>

    <g transform="translate(0 358)">
      <text x="0" y="19" fill="#8b8f98" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">08:40</text>
      <text x="74" y="18" fill="#e7e8eb" font-size="18" font-weight="560">Maintenance notice published</text>
      <circle cx="538" cy="15" r="4" fill="#4fae7b"/>
      <text x="551" y="20" fill="#68bd91" font-size="14">Confirmed</text>
    </g>

    <rect x="0" y="387" width="624" height="82" rx="8" fill="#111214" stroke="#292b30"/>
    <text x="18" y="416" fill="#777b84" font-size="13">SELECTED EVIDENCE</text>
    <text x="18" y="445" fill="#f4f5f7" font-size="18" font-weight="580">Issuer changed · Certificate observer</text>
    <rect x="428" y="406" width="178" height="44" rx="6" fill="#5e6ad2"/>
    <text x="517" y="434" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Record finding</text>
  </g>
</svg>
