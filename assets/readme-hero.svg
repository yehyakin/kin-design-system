<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">KIN certificate-change investigation illustration</title>
  <desc id="desc">A certificate-change timeline with source status, selected evidence, and an action to record the reviewed finding.</desc>

  <rect width="1200" height="560" rx="14" fill="#08090a"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="13.5" fill="none" stroke="#2a2c30"/>

  <rect x="1" y="1" width="1198" height="55" rx="13" fill="#0d0e10"/>
  <path d="M1 43h1198v13H1z" fill="#0d0e10"/>
  <line x1="1" y1="56" x2="1199" y2="56" stroke="#24262a"/>
  <text x="28" y="35" fill="#f4f5f7" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" letter-spacing="0.08em">KIN REFERENCE</text>
  <text x="204" y="35" fill="#777b84" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">INT-02</text>
  <text x="1172" y="35" fill="#777b84" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" text-anchor="end">DETERMINISTIC LOCAL DATA</text>

  <rect x="1" y="56" width="194" height="503" fill="#0b0c0e"/>
  <line x1="195" y1="56" x2="195" y2="559" stroke="#24262a"/>

  <g transform="translate(24 82)" font-family="Inter,Arial,sans-serif">
    <rect width="32" height="32" rx="6" fill="#121315" stroke="#34363b"/>
    <path d="M9 8v16m0-7 7-9m-7 9 8 7m6-16v16" fill="none" stroke="#f4f5f7" stroke-width="2.2"/>
    <path d="M26 8v16" stroke="#6f79dc" stroke-width="2.2"/>
    <text x="44" y="20" fill="#f4f5f7" font-size="17" font-weight="600">Investigations</text>

    <text x="0" y="84" fill="#666a72" font-size="13" font-weight="650" letter-spacing="0.08em">WORKSPACE</text>
    <rect x="-8" y="104" width="162" height="42" rx="6" fill="#17191d"/>
    <rect x="-8" y="104" width="3" height="42" rx="1.5" fill="#6f79dc"/>
    <circle cx="10" cy="125" r="4" fill="#6f79dc"/>
    <text x="26" y="131" fill="#f4f5f7" font-size="17" font-weight="550">Evidence review</text>

    <circle cx="10" cy="174" r="4" fill="#555960"/>
    <text x="26" y="180" fill="#a6a9b0" font-size="17">Source registry</text>
    <circle cx="10" cy="220" r="4" fill="#555960"/>
    <text x="26" y="226" fill="#a6a9b0" font-size="17">Risk queue</text>
    <circle cx="10" cy="266" r="4" fill="#555960"/>
    <text x="26" y="272" fill="#a6a9b0" font-size="17">Change history</text>

    <text x="0" y="338" fill="#666a72" font-size="13" font-weight="650" letter-spacing="0.08em">SCOPE</text>
    <text x="0" y="375" fill="#c7c9cf" font-size="16">All evidence</text>
    <text x="0" y="410" fill="#888c94" font-size="16">Conflicts and gaps</text>
    <text x="0" y="445" fill="#888c94" font-size="16">Unverified</text>
  </g>

  <rect x="196" y="57" width="684" height="502" fill="#0f1012"/>
  <g transform="translate(232 88)" font-family="Inter,Arial,sans-serif">
    <text x="0" y="0" fill="#777b84" font-size="14" font-weight="600" letter-spacing="0.07em">INVESTIGATIONS / INV-028</text>
    <text x="0" y="51" fill="#f4f5f7" font-size="38" font-weight="620" letter-spacing="-0.8">Certificate change review</text>
    <text x="0" y="84" fill="#a4a8b1" font-size="19">Compare chronology and sources before recording a finding.</text>

    <g transform="translate(0 112)">
      <rect width="612" height="66" rx="8" fill="#131417" stroke="#292b30"/>
      <line x1="204" y1="12" x2="204" y2="54" stroke="#292b30"/>
      <line x1="408" y1="12" x2="408" y2="54" stroke="#292b30"/>
      <text x="18" y="25" fill="#777b84" font-size="13">TIME RANGE</text>
      <text x="18" y="48" fill="#e2e3e7" font-size="17" font-weight="550">Last 30 days</text>
      <text x="222" y="25" fill="#777b84" font-size="13">SOURCES</text>
      <text x="222" y="48" fill="#e2e3e7" font-size="17" font-weight="550">4 attributable</text>
      <text x="426" y="25" fill="#777b84" font-size="13">FINDING</text>
      <text x="426" y="48" fill="#d6a84a" font-size="17" font-weight="550">Not recorded</text>
    </g>

    <text x="0" y="219" fill="#f4f5f7" font-size="19" font-weight="600">Evidence timeline</text>
    <text x="612" y="219" fill="#777b84" font-size="14" text-anchor="end">4 local events</text>
    <line x1="0" y1="237" x2="612" y2="237" stroke="#2a2c30"/>

    <g transform="translate(0 253)">
      <text x="0" y="19" fill="#8b8f98" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">09:11</text>
      <text x="70" y="17" fill="#e7e8eb" font-size="17" font-weight="560">Change-log source unavailable</text>
      <text x="70" y="41" fill="#8f939b" font-size="14">The archive could not confirm the rotation record.</text>
      <circle cx="522" cy="20" r="4" fill="#d6a84a"/>
      <text x="534" y="25" fill="#c8a558" font-size="14">Pending</text>
      <line x1="0" y1="58" x2="612" y2="58" stroke="#24262a"/>
    </g>

    <g transform="translate(0 323)">
      <rect x="-10" y="-8" width="632" height="64" rx="6" fill="#17191d"/>
      <text x="0" y="19" fill="#aeb1b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">09:02</text>
      <text x="70" y="17" fill="#ffffff" font-size="17" font-weight="580">Certificate issuer changed</text>
      <text x="70" y="41" fill="#9ea2aa" font-size="14">North CA 4 changed to North CA 5.</text>
      <circle cx="522" cy="20" r="4" fill="#d85b68"/>
      <text x="534" y="25" fill="#df7883" font-size="14">Conflict</text>
    </g>

    <g transform="translate(0 393)">
      <text x="0" y="19" fill="#8b8f98" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">08:40</text>
      <text x="70" y="17" fill="#e7e8eb" font-size="17" font-weight="560">Maintenance notice published</text>
      <text x="70" y="41" fill="#8f939b" font-size="14">The planned rotation window is 09:00–09:30.</text>
      <circle cx="522" cy="20" r="4" fill="#4fae7b"/>
      <text x="534" y="25" fill="#68bd91" font-size="14">Confirmed</text>
    </g>
  </g>

  <rect x="880" y="57" width="319" height="502" fill="#0c0d0f"/>
  <line x1="880" y1="56" x2="880" y2="559" stroke="#24262a"/>
  <g transform="translate(910 91)" font-family="Inter,Arial,sans-serif">
    <text x="0" y="0" fill="#777b84" font-size="13" font-weight="650" letter-spacing="0.08em">SELECTED EVIDENCE</text>
    <text x="0" y="49" fill="#f4f5f7" font-size="27" font-weight="610">Issuer changed</text>
    <text x="0" y="78" fill="#9ca0a8" font-size="16">EVT-318 · observed 09:04</text>
    <line x1="0" y1="106" x2="259" y2="106" stroke="#292b30"/>

    <text x="0" y="145" fill="#777b84" font-size="13">SOURCE</text>
    <text x="0" y="172" fill="#e2e3e7" font-size="17">Certificate observer</text>
    <text x="0" y="218" fill="#777b84" font-size="13">SOURCE STATE</text>
    <text x="0" y="245" fill="#e2e3e7" font-size="17">Available</text>
    <text x="0" y="291" fill="#777b84" font-size="13">VERIFICATION</text>
    <circle cx="5" cy="316" r="5" fill="#d85b68"/>
    <text x="18" y="322" fill="#df7883" font-size="17">Conflicting</text>

    <line x1="0" y1="355" x2="259" y2="355" stroke="#292b30"/>
    <text x="0" y="393" fill="#777b84" font-size="13">NEXT ACTION</text>
    <rect x="0" y="414" width="259" height="42" rx="6" fill="#5e6ad2"/>
    <text x="129.5" y="441" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">Record reviewed finding</text>
  </g>
</svg>
